name: Build Android APK / AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "What to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - debug-apk
          - release-apk
          - release-aab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing (release only)
        if: inputs.build_type != 'debug-apk'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Add GitHub Secrets for release builds (see docs/merge/GITHUB_ANDROID_BUILD.md)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/prt.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=prt.jks
          EOF

      - name: Build debug APK
        if: inputs.build_type == 'debug-apk' || inputs.build_type == 'all'
        run: flutter build apk --debug

      - name: Build release APK
        if: inputs.build_type == 'release-apk' || inputs.build_type == 'all'
        run: flutter build apk --release

      - name: Build release AAB (Play Store)
        if: inputs.build_type == 'release-aab' || inputs.build_type == 'all'
        run: flutter build appbundle --release

      - name: Upload debug APK
        if: inputs.build_type == 'debug-apk' || inputs.build_type == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: sellspoint-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: inputs.build_type == 'release-apk' || inputs.build_type == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: sellspoint-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB
        if: inputs.build_type == 'release-aab' || inputs.build_type == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: sellspoint-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
