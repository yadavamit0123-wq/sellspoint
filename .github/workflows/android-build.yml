name: Build Android APK / AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "What to build"
        required: true
        default: "debug-apk"
        type: choice
        options:
          - debug-apk
          - release-apk
          - release-aab
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 3.32.0 = Dart 3.8.0; flutter_stripe needs Dart >=3.8.1
          flutter-version: "3.32.8"
          cache: false

      - name: Flutter version
        run: |
          flutter --version
          dart --version
          DART_VER=$(dart --version 2>&1 | sed -n 's/.*Dart SDK version: \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')
          DART_MAJOR=$(echo "$DART_VER" | cut -d. -f1)
          DART_MINOR=$(echo "$DART_VER" | cut -d. -f2)
          DART_PATCH=$(echo "$DART_VER" | cut -d. -f3)
          if [ "${DART_MAJOR:-0}" -lt 3 ]; then
            echo "ERROR: Dart too old for this project (got ${DART_VER:-unknown})"
            exit 1
          fi
          if [ "${DART_MINOR:-0}" -lt 8 ]; then
            echo "ERROR: Need Dart 3.8.1+ (flutter_stripe). Got Dart ${DART_VER:-unknown}"
            exit 1
          fi
          if [ "${DART_MINOR:-0}" -eq 8 ] && [ "${DART_PATCH:-0}" -lt 1 ]; then
            echo "ERROR: Need Dart 3.8.1+ (flutter_stripe). Got Dart ${DART_VER:-unknown}"
            echo "Flutter 3.32.0 is Dart 3.8.0 — use Flutter 3.32.8+"
            exit 1
          fi
          echo "Dart SDK OK for flutter_stripe (>=3.8.1): ${DART_VER}"

      - name: Prepare Android Gradle (CI compatibility)
        run: |
          # Gradle 8.14+ required by current Flutter Android tooling
          sed -i 's|gradle-8\.[0-9.]*-all|gradle-8.14.3-all|g' android/gradle/wrapper/gradle-wrapper.properties
          # AGP 9 opt-out — must exist before any Gradle task
          touch android/gradle.properties
          grep -q '^android.newDsl=false' android/gradle.properties || echo 'android.newDsl=false' >> android/gradle.properties
          grep -q '^android.builtInKotlin=false' android/gradle.properties || echo 'android.builtInKotlin=false' >> android/gradle.properties
          echo "--- gradle-wrapper ---"
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle.properties (AGP flags) ---"
          grep -E 'android.newDsl|android.builtInKotlin' android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Check release signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          wants_release="${{ inputs.build_type }}"
          if [ "$wants_release" = "debug-apk" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Debug-only build — signing not required."
            exit 0
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets found."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "$wants_release" != "all" ]; then
              echo "ERROR: Release build needs GitHub Secrets (see docs/merge/GITHUB_ANDROID_BUILD.md)"
              exit 1
            fi
            echo "WARNING: Release secrets missing — will build debug APK only."
          fi

      - name: Configure Android signing
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/prt.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=prt.jks
          EOF

      - name: Build debug APK
        if: inputs.build_type == 'debug-apk' || inputs.build_type == 'all'
        run: flutter build apk --debug

      - name: Build release APK
        if: (inputs.build_type == 'release-apk' || inputs.build_type == 'all') && steps.signing.outputs.ready == 'true'
        run: flutter build apk --release

      - name: Build release AAB (Play Store)
        if: (inputs.build_type == 'release-aab' || inputs.build_type == 'all') && steps.signing.outputs.ready == 'true'
        run: flutter build appbundle --release

      - name: Upload debug APK
        if: inputs.build_type == 'debug-apk' || inputs.build_type == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: sellspoint-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: (inputs.build_type == 'release-apk' || inputs.build_type == 'all') && steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sellspoint-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB
        if: (inputs.build_type == 'release-aab' || inputs.build_type == 'all') && steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sellspoint-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
