name: eClassify
description: A classified app

publish_to: 'none'

version: 2.0.2+18

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: 3.38.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (2.14)
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_messaging: ^16.2.2
  firebase_app_check: ^0.4.4+1

  # State / network
  flutter_bloc: ^9.1.1
  dio: ^5.8.0+1
  dio_cache_interceptor: ^4.0.7
  http_cache_hive_store: ^5.1.0
  rxdart: ^0.28.0
  connectivity_plus: ^6.0.5

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  dotted_border: ^2.1.0
  flutter_svg: ^2.2.3
  lottie: ^3.3.1
  staggered_grid_view: ^0.0.1
  animated_text_kit: ^4.3.0
  phosphoricons_flutter:
    git:
      url: https://github.com/wrteam-ishit/phosphoricons_flutter.git

  # Media / files
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0
  video_player: ^2.11.1
  omni_video_player: ^4.0.2
  flick_video_player: ^0.9.0
  youtube_player_flutter: ^9.1.1
  video_trimmer: ^5.0.0
  heif_converter: ^1.0.6
  record: ^6.2.0
  audioplayers: ^6.4.0
  flutter_pdfview: ^1.4.0+1
  pdfx: ^2.9.2
  file_picker: ^11.0.2
  background_downloader: ^9.5.5
  open_file: ^3.5.10
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Maps / location
  google_maps_flutter: ^2.14.0
  geocoding: ^4.0.0
  geolocator: ^14.0.0

  # Auth / device
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^8.0.0
  permission_handler: ^12.0.1
  device_info_plus: ^12.4.0
  device_region: ^1.4.0
  package_info_plus: ^9.0.1
  sms_autofill: ^2.4.1
  flutter_libphonenumber: ^2.7.0

  # Links / share / review
  url_launcher: ^6.3.1
  share_plus: ^12.0.1
  in_app_review: ^2.0.10
  app_links: ^6.3.1
  any_link_preview: ^3.0.0
  flutter_link_previewer: ^4.2.0

  # Notifications / ads
  awesome_notifications: ^0.11.0
  google_mobile_ads: ^8.0.0
  vibration: ^3.1.3

  # Web / HTML
  webview_flutter: ^4.11.0
  flutter_widget_from_html: ^0.17.2
  flutter_html_to_pdf_plus: ^0.4.0
  html: ^0.15.6

  # Utils
  country_picker: ^2.0.26
  mime_type: ^1.0.1
  encrypt: ^5.0.3
  collection: ^1.19.1
  uuid: ^4.5.2
  logger: ^2.6.2
  intl: ^0.20.2
  timeago: ^3.7.1
  timeago_flutter: ^3.7.0
  android_intent_plus: 6.0.0

  # Payments
  flutter_stripe: ^12.6.0
  in_app_purchase: ^3.2.1
  razorpay_flutter: ^1.4.0
  phonepe_payment_sdk: ^3.0.0

dev_dependencies:
  change_app_package_name: ^1.5.0
  curl_logger_dio_interceptor: ^1.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  rename: ^3.0.0
  device_preview: ^1.2.0

flutter:
  uses-material-design: true

  assets:
    # Legacy (live UI)
    - assets/svg/
    - assets/videos/
    - assets/svg/bottomnav/
    - assets/languages/
    - assets/lottie/
    - assets/chat_background/
    - assets/svg/Logo/
    - assets/svg/Illustrators/
    - assets/svg/payment/
    # eClassify 2.14 layout (merge; unused until screens migrate)
    - assets/icons/bottom_navigation/
    - assets/icons/branding/
    - assets/icons/illustrators/
    - assets/icons/payment/
    - assets/icons/profile/
    - assets/icons/social/
    - assets/icons/common/
    - assets/map/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
